<script>
        function toggleAuth(view) {
            const loginView = document.getElementById('login-view');
            const signupView = document.getElementById('signup-view');
            
            if (view === 'signup') {
                loginView.classList.add('hidden', 'scale-95', 'opacity-0');
                loginView.classList.remove('scale-100', 'opacity-100');
                
                signupView.classList.remove('hidden');
                setTimeout(() => {
                    signupView.classList.add('scale-100', 'opacity-100');
                    signupView.classList.remove('scale-95', 'opacity-0');
                }, 10);
            } else {
                signupView.classList.add('hidden', 'scale-95', 'opacity-0');
                signupView.classList.remove('scale-100', 'opacity-100');
                
                loginView.classList.remove('hidden');
                setTimeout(() => {
                    loginView.classList.add('scale-100', 'opacity-100');
                    loginView.classList.remove('scale-95', 'opacity-0');
                }, 10);
            }
        }
    </script>
